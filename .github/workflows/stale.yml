name: Stale Issues & PRs

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "priority: high,good first issue,help wanted"
          exempt-pr-labels: "priority: high"
          stale-issue-message: >
            这条 Issue 已经 60 天没有活动，标记为 stale。
            如果问题仍然存在，请回复保留它；否则将在 14 天后自动关闭。
          close-issue-message: >
            因长期无活动已自动关闭。如仍需跟进，欢迎重新开启或新建 Issue。
          stale-pr-message: >
            这个 PR 已经 45 天没有活动，标记为 stale。
            作者如仍在推进，请回复或推一次 commit 保留它。
          close-pr-message: >
            因长期无活动已自动关闭。可以继续推进时，重开或新建 PR 均可。
