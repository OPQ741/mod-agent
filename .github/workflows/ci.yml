name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的新提交自动取消旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:eslint

      - name: Typecheck
        run: npm run typecheck

      - name: Markdown, docs links & AGENTS.md commands
        run: |
          npm run lint:md
          npm run lint:links
          npm run lint:agents

      - name: Prettier check
        run: npm run format:check

  docs-build:
    name: VitePress Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build
