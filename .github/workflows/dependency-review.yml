name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Block known-vulnerable deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-3-Clause, BSD-2-Clause, CC0-1.0, CC-BY-4.0, Unlicense, 0BSD, BlueOak-1.0.0
