name: 缺陷报告
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全类问题请不要在这里报告，见 SECURITY.md。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简要地描述这个问题。
      placeholder: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 给出可稳定复现的最小步骤。
      placeholder: |
        1. 运行 `npm run ...`
        2. 输入 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你期望看到什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Node.js 版本、分支或提交等。
      value: |
        - OS:
        - Node.js:
        - 分支 / commit:
    validations:
      required: true
