name: 功能建议
description: 提出一个新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先用一句话说清你想解决的问题，而不是直接给方案。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个功能背后的真实痛点或场景是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议的方案
      description: 可选。你设想的实现或交互方式。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 你考虑过哪些其它做法，为什么没选。
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及哪些模块或文档？是否属于跨模块的架构决策（可能需要 ADR）？
