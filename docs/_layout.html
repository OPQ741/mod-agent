<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · mod-agent</title>
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #2c3338;
    --muted: #8a9198;
    --line: #eceae3;
    --accent: #5b7fb5;
    --soft: #f3f1ea;
    --code-bg: #f5f3ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.78 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }

  /* 侧边栏 */
  aside {
    width: 270px; flex-shrink: 0;
    padding: 40px 0 24px;
    border-right: 1px solid var(--line);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand, .brand-sub { padding: 0 24px; }
  nav a {
    display: block; padding: 8px 24px; margin: 0;
    color: #5a6268; text-decoration: none; font-size: 13.5px;
    border-left: 3px solid transparent;
    transition: all .15s;
  }
  nav a:hover { background: var(--soft); color: var(--ink); }
  nav a.active {
    background: #fff; color: var(--accent); font-weight: 500;
    border-left-color: var(--accent);
  }
  nav .num {
    display: inline-block; width: 22px; margin-right: 6px;
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* 正文 */
  main { flex: 1; max-width: 760px; margin: 0 auto; padding: 56px 48px 100px; }
  main h1 {
    font-family: Georgia, "Songti SC", serif;
    font-size: 30px; font-weight: 600; margin: 0 0 8px; color: var(--ink);
  }
  main h2 {
    font-family: Georgia, "Songti SC", serif;
    font-size: 21px; font-weight: 600; margin: 40px 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  main h3 { font-size: 16.5px; margin: 28px 0 8px; }
  main p { margin: 12px 0; }
  main a { color: var(--accent); }
  main code {
    background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  main pre {
    background: var(--code-bg); padding: 14px 18px; border-radius: 8px;
    overflow-x: auto; font-size: 13px; line-height: 1.6;
    border: 1px solid var(--line);
  }
  main pre code { background: transparent; padding: 0; }
  main blockquote {
    margin: 16px 0; padding: 4px 16px;
    border-left: 3px solid var(--accent);
    color: #5a6268; background: transparent;
  }
  main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  main th, main td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  main th { background: var(--soft); font-weight: 500; }
  main ul, main ol { padding-left: 24px; }
  main li { margin: 4px 0; }
  main hr { border: none; border-top: 1px solid var(--line); margin: 32px 0; }

  .mermaid { background: #fff; text-align: center; margin: 20px 0; padding: 16px; border-radius: 8px; border: 1px solid var(--line); }

  /* 上下篇 */
  .pager {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line);
  }
  .pager a {
    color: var(--accent); text-decoration: none; font-size: 14px;
    padding: 8px 14px; border-radius: 6px; background: #fff; border: 1px solid var(--line);
  }
  .pager a:hover { background: var(--soft); }
  .pager .placeholder { visibility: hidden; }

  /* 移动端 */
  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; padding: 20px; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 28px 20px 60px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">mod-agent</div>
    <div class="brand-sub">AI Coding Agent · 设计文档</div>
    <nav>{{NAV}}</nav>
  </aside>
  <main>
    {{CONTENT}}
    <div class="pager">
      {{PREV_HTML}}
      {{NEXT_HTML}}
    </div>
  </main>
</div>
<script src="/marked.min.js"></script>
<script src="/mermaid.min.js"></script>
<script>
  if (window.mermaid) mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
</script>
</body>
</html>
